name: Trigger auto deployment for aix-mcp-planner-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aix-mcp-planner-dev-AutoDeployTrigger-f927f111-e14e-418f-b8d2-03985630cec3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIXMCPPLANNERDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIXMCPPLANNERDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIXMCPPLANNERDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.AIXMCPPLANNERDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIXMCPPLANNERDEV_REGISTRY_PASSWORD }}
          containerAppName: aix-mcp-planner-dev
          resourceGroup: rg-we-aix-prototype
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


