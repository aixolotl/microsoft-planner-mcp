[project]
name = "microsoft-planner-mcp"
version = "0.1.0"
description = "MCP server for Microsoft Planner via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps]>=3.2.3",
    "msgraph-sdk>=1.55.0",
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
